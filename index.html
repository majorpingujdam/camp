<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Drop Pit</title>
<meta name="description" content="A minimalist 3D pit — pick a shape and color, and drop objects into the tank. Scan to play on your phone." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" />
<style>
  :root{
    --bg:#0c0d10; --bg2:#141519; --ink:#f3f4f6; --muted:#8b8f9a; --line:rgba(255,255,255,.12);
    --surface:rgba(20,21,26,.66); --accent:#f3f4f6;
    --body:'IBM Plex Sans', system-ui, sans-serif;
    --mono:'Space Mono', ui-monospace, monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f6f4; --bg2:#ffffff; --ink:#17181c; --muted:#6c6f78; --line:rgba(20,22,28,.14);
      --surface:rgba(255,255,255,.72); --accent:#17181c;
      color-scheme:light;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{
    font-family:var(--body); color:var(--ink); overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0%, var(--bg2), var(--bg) 70%);
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important}
  button{font-family:inherit; cursor:pointer; color:inherit}
  #tank{position:fixed; inset:0; z-index:0; width:100%; height:100%; touch-action:none; cursor:grab}
  #tank:active{cursor:grabbing}

  .ui{position:fixed; inset:0; z-index:1; pointer-events:none; display:flex; flex-direction:column;
      padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}

  /* top */
  .top{display:flex; align-items:center; gap:12px}
  .mark{font-family:var(--mono); font-weight:700; letter-spacing:.24em; text-transform:uppercase; font-size:.82rem}
  .count{font-family:var(--mono); font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .tools{margin-left:auto; display:flex; gap:8px; pointer-events:auto}
  .ico{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
       backdrop-filter:blur(12px); display:grid; place-items:center; font-size:.9rem; color:var(--muted); transition:color .15s, border-color .15s}
  .ico:hover{color:var(--ink); border-color:var(--ink)}

  .spacer{flex:1}

  /* bottom control bar */
  .bar{pointer-events:auto; align-self:center; width:min(720px,100%);
       background:var(--surface); border:1px solid var(--line); backdrop-filter:blur(16px);
       border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center}
  .grp{display:flex; align-items:center; gap:10px}
  .lab{font-family:var(--mono); font-size:.58rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
  .shapes{display:flex; gap:6px}
  .shape{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:transparent;
         display:grid; place-items:center; transition:border-color .15s, background .15s, transform .1s}
  .shape svg{width:20px; height:20px; fill:none; stroke:var(--muted); stroke-width:1.6}
  .shape:hover{transform:translateY(-2px)}
  .shape.on{border-color:var(--ink); background:color-mix(in srgb, var(--ink) 8%, transparent)}
  .shape.on svg{stroke:var(--ink)}
  .sep{width:1px; align-self:stretch; background:var(--line); margin:2px 0}
  .colors{display:flex; gap:7px; flex-wrap:wrap; max-width:230px}
  .sw{width:24px; height:24px; border-radius:50%; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); transition:transform .1s}
  .sw:hover{transform:scale(1.12)}
  .sw.on{border-color:var(--ink); transform:scale(1.12)}
  .drop{border:1px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:11px;
        padding:11px 20px; font-family:var(--mono); font-weight:700; font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; transition:transform .1s, opacity .15s}
  .drop:active{transform:scale(.96)}

  .hint{align-self:center; font-family:var(--mono); font-size:.6rem; color:var(--muted); margin-top:10px}

  /* QR */
  .qr{position:fixed; top:calc(64px + env(safe-area-inset-top,0px)); right:18px; z-index:1; pointer-events:auto;
      background:var(--surface); border:1px solid var(--line); backdrop-filter:blur(14px); border-radius:12px;
      padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; width:104px}
  .qr #qr{width:84px; height:84px; background:#fff; border-radius:7px; padding:5px; display:grid; place-items:center}
  .qr #qr img,.qr #qr canvas{width:100%!important; height:100%!important; image-rendering:pixelated}
  .qr small{font-family:var(--mono); font-size:.5rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}

  @media (max-width:560px){
    .qr{width:78px; top:auto; bottom:calc(150px + env(safe-area-inset-bottom,0px))}
    .qr #qr{width:60px;height:60px}
    .bar{gap:12px; padding:12px}
    .colors{max-width:180px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important} }
</style>
</head>
<body>
<canvas id="tank" aria-label="A 3D pit. Drag to look around, tap to drop an object."></canvas>

<div class="ui">
  <div class="top">
    <span class="mark">Drop&nbsp;Pit</span>
    <span class="count"><b id="count">0</b> objects</span>
    <div class="tools">
      <button class="ico" id="soundBtn" title="Sound" aria-label="Toggle sound">♪</button>
      <button class="ico" id="clearBtn" title="Clear" aria-label="Clear pit">✕</button>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="bar">
    <div class="grp">
      <span class="lab">shape</span>
      <div class="shapes" id="shapes"></div>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <span class="lab">color</span>
      <div class="colors" id="colors"></div>
    </div>
    <div class="sep"></div>
    <button class="drop" id="dropBtn">Drop</button>
  </div>
  <div class="hint">drag to look around · tap the tank to drop</div>
</div>

<div class="qr">
  <div id="qr"></div>
  <small>scan to play</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
(function(){
  var $=function(s){return document.querySelector(s);};
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var isSmall = Math.min(innerWidth,innerHeight) < 560;

  /* ---------- selections ---------- */
  var COLORS=["#ef5f5f","#f2994a","#f2c94c","#6fcf80","#4fd1c5","#5b8def","#9b7bff","#f277c6","#eef0f3","#22242e"];
  var myColor = COLORS[Math.floor(Math.random()*8)];
  var myShape = "ball";
  var muted = false;

  var SHAPE_ICONS = {
    ball:    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>',
    cube:    '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>',
    pyramid: '<svg viewBox="0 0 24 24"><path d="M12 4 L20 19 L4 19 Z" stroke-linejoin="round"/></svg>',
    diamond: '<svg viewBox="0 0 24 24"><path d="M12 3 L20 12 L12 21 L4 12 Z" stroke-linejoin="round"/></svg>'
  };
  var SHAPE_ORDER=["ball","cube","pyramid","diamond"];

  (function buildShapes(){
    var box=$("#shapes");
    SHAPE_ORDER.forEach(function(s){
      var b=document.createElement("button");
      b.className="shape"+(s===myShape?" on":""); b.innerHTML=SHAPE_ICONS[s]; b.title=s;
      b.addEventListener("click", function(){
        myShape=s; box.querySelectorAll(".shape").forEach(function(x){x.classList.remove("on");}); b.classList.add("on");
      });
      box.appendChild(b);
    });
  })();
  (function buildColors(){
    var box=$("#colors");
    COLORS.forEach(function(c){
      var b=document.createElement("button");
      b.className="sw"+(c===myColor?" on":""); b.style.background=c; b.setAttribute("aria-label","color");
      b.addEventListener("click", function(){
        myColor=c; box.querySelectorAll(".sw").forEach(function(x){x.classList.remove("on");}); b.classList.add("on");
      });
      box.appendChild(b);
    });
  })();

  /* ---------- QR of this page's URL ---------- */
  var SHARE_URL = window.location.href.split("#")[0];
  try{
    new QRCode($("#qr"), {text:SHARE_URL, width:160, height:160, colorDark:"#0c0d10", colorLight:"#ffffff",
      correctLevel:(window.QRCode&&QRCode.CorrectLevel)?QRCode.CorrectLevel.M:undefined});
  }catch(e){ $("#qr").textContent="QR"; }

  /* ---------- soft drop sound ---------- */
  var actx=null;
  $("#soundBtn").addEventListener("click", function(){
    muted=!muted; this.textContent = muted?"—":"♪"; this.style.color = muted?"var(--muted)":"var(--ink)";
  });
  function tock(){
    if(muted) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
      o.type="sine"; o.frequency.value=150+Math.random()*50;
      g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.0008,t+0.13);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.14);
    }catch(e){}
  }

  /* ==========================================================
     3D pit — three.js render + cannon.js physics
  ========================================================== */
  var canvas=$("#tank");
  if(typeof THREE==="undefined" || typeof CANNON==="undefined"){ $("#count").textContent="—"; return; }
  var renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas, alpha:true, antialias:true}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.1, 200);

  var hemi=new THREE.HemisphereLight(0xffffff,0x30323c,0.85); scene.add(hemi);
  var key=new THREE.DirectionalLight(0xffffff,0.75); key.position.set(5,15,7); scene.add(key);
  key.castShadow=true; key.shadow.mapSize.set(1024,1024);
  key.shadow.camera.left=-6; key.shadow.camera.right=6; key.shadow.camera.top=12; key.shadow.camera.bottom=-3;
  key.shadow.camera.near=1; key.shadow.camera.far=45; key.shadow.bias=-0.0006;

  var HALF_W=3, HALF_D=2, HEIGHT=8, SPAWN_Y=6.6;
  var MAX = isSmall ? 45 : 120;

  // floor + minimal glass outline
  var floorMesh=new THREE.Mesh(
    new THREE.BoxGeometry(2*HALF_W+0.2,0.4,2*HALF_D+0.2),
    new THREE.MeshStandardMaterial({color:0x14151a, metalness:0.0, roughness:0.9}));
  floorMesh.position.y=-0.2; floorMesh.receiveShadow=true; scene.add(floorMesh);
  var edges=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(2*HALF_W,HEIGHT,2*HALF_D)),
    new THREE.LineBasicMaterial({color:0x8a8f9c, transparent:true, opacity:0.28}));
  edges.position.y=HEIGHT/2; scene.add(edges);

  // physics world
  var world=new CANNON.World();
  world.gravity.set(0,-22,0);
  world.broadphase=new CANNON.NaiveBroadphase();
  world.solver.iterations=10;
  var objMat=new CANNON.Material("o"), wallMat=new CANNON.Material("w");
  world.addContactMaterial(new CANNON.ContactMaterial(objMat,wallMat,{friction:0.25,restitution:0.2}));
  world.addContactMaterial(new CANNON.ContactMaterial(objMat,objMat,{friction:0.35,restitution:0.1}));

  function addPlane(px,py,pz, ax,ay,az, angle){
    var b=new CANNON.Body({mass:0, material:wallMat});
    b.addShape(new CANNON.Plane());
    b.quaternion.setFromAxisAngle(new CANNON.Vec3(ax,ay,az), angle);
    b.position.set(px,py,pz); world.addBody(b);
  }
  addPlane(0,0,0, 1,0,0, -Math.PI/2);
  addPlane(-HALF_W,0,0, 0,1,0, Math.PI/2);
  addPlane(HALF_W,0,0, 0,1,0, -Math.PI/2);
  addPlane(0,0,-HALF_D, 0,1,0, 0);
  addPlane(0,0,HALF_D, 0,1,0, Math.PI);

  /* ----- shared geometries + colliders ----- */
  var R=0.36;                       // ball radius
  var CH=0.32;                      // cube half-extent
  var Rp=0.44, Hp=0.78;            // pyramid base radius / height
  var Ro=0.46;                      // diamond radius

  var geo={
    ball:    new THREE.SphereGeometry(R,26,18),
    cube:    new THREE.BoxGeometry(2*CH,2*CH,2*CH),
    pyramid: new THREE.ConeGeometry(Rp,Hp,4),
    diamond: new THREE.OctahedronGeometry(Ro,0)
  };

  function v3(x,y,z){ return new CANNON.Vec3(x,y,z); }
  // square pyramid convex (matches ConeGeometry(Rp,Hp,4): base ring on axes, apex up)
  var pyramidShape = new CANNON.ConvexPolyhedron(
    [ v3(0,-Hp/2,Rp), v3(Rp,-Hp/2,0), v3(0,-Hp/2,-Rp), v3(-Rp,-Hp/2,0), v3(0,Hp/2,0) ],
    [ [0,3,2,1], [0,1,4], [1,2,4], [2,3,4], [3,0,4] ]
  );
  // octahedron convex (matches OctahedronGeometry: verts on axes)
  var diamondShape = new CANNON.ConvexPolyhedron(
    [ v3(Ro,0,0), v3(-Ro,0,0), v3(0,Ro,0), v3(0,-Ro,0), v3(0,0,Ro), v3(0,0,-Ro) ],
    [ [2,4,0],[2,0,5],[2,5,1],[2,1,4],[3,0,4],[3,5,0],[3,1,5],[3,4,1] ]
  );
  var colliders={
    ball:    function(){ return new CANNON.Sphere(R); },
    cube:    function(){ return new CANNON.Box(v3(CH,CH,CH)); },
    pyramid: function(){ return pyramidShape; },
    diamond: function(){ return diamondShape; }
  };
  var maxExtent = Math.max(R, CH*1.42, Rp, Ro);

  var objs=[];
  function updateCount(){ $("#count").textContent=objs.length; }

  function spawn(shape,color,x,z){
    var mat=new THREE.MeshStandardMaterial({color:color, metalness:0.05, roughness:0.45});
    var mesh=new THREE.Mesh(geo[shape],mat); mesh.castShadow=true; scene.add(mesh);
    var body=new CANNON.Body({mass:1, material:objMat});
    body.addShape(colliders[shape]());
    body.position.set(x, SPAWN_Y, z);
    body.velocity.set((Math.random()-0.5)*1.2, -2.5, (Math.random()-0.5)*1.2);
    body.angularVelocity.set((Math.random()-0.5)*4,(Math.random()-0.5)*4,(Math.random()-0.5)*4);
    body.linearDamping=0.06; body.angularDamping=0.2;
    world.addBody(body);
    objs.push({mesh:mesh, body:body, mat:mat});
    if(objs.length>MAX){ var old=objs.shift(); world.removeBody(old.body); scene.remove(old.mesh); old.mat.dispose(); }
    updateCount(); tock();
    var d=$("#dropBtn"); d.style.transform="scale(.94)"; setTimeout(function(){ d.style.transform=""; },90);
  }
  function rand(r){ return (Math.random()-0.5)*2*r; }
  function doDrop(){ spawn(myShape, myColor, rand(HALF_W-maxExtent-0.1), rand(HALF_D-maxExtent-0.1)); }

  $("#dropBtn").addEventListener("click", doDrop);
  $("#clearBtn").addEventListener("click", function(){
    objs.forEach(function(o){ world.removeBody(o.body); scene.remove(o.mesh); o.mat.dispose(); });
    objs=[]; updateCount();
  });

  /* ---------- camera orbit + tap to drop ---------- */
  var target=new THREE.Vector3(0,2.4,0), Rcam=14.5;
  var theta=0.6, phi=1.12, tTheta=theta, tPhi=phi;
  var dragging=false, lx=0, ly=0, downT=0, moved=0;
  canvas.addEventListener("pointerdown", function(e){
    dragging=true; lx=e.clientX; ly=e.clientY; downT=Date.now(); moved=0;
    canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
  });
  addEventListener("pointermove", function(e){
    if(!dragging) return;
    var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    tTheta-=dx*0.006; tPhi=Math.max(0.35,Math.min(1.45, tPhi-dy*0.006));
  });
  addEventListener("pointerup", function(){
    if(!dragging) return; dragging=false;
    if(moved<10 && (Date.now()-downT)<300){ doDrop(); }
  });
  addEventListener("pointercancel", function(){ dragging=false; });

  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  resize(); addEventListener("resize",resize);

  var clock=new THREE.Clock();
  (function frame(){
    var dt=Math.min(clock.getDelta(),0.033);
    world.step(1/60, dt, 3);
    for(var i=0;i<objs.length;i++){ objs[i].mesh.position.copy(objs[i].body.position); objs[i].mesh.quaternion.copy(objs[i].body.quaternion); }
    theta+=(tTheta-theta)*0.12; phi+=(tPhi-phi)*0.12;
    camera.position.set(
      target.x + Rcam*Math.sin(phi)*Math.sin(theta),
      target.y + Rcam*Math.cos(phi),
      target.z + Rcam*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  })();

  // seed a few varied objects so the pit reads at a glance
  spawn("ball","#5b8def",-1.1,0.3);
  spawn("cube","#f2994a",0.9,-0.4);
  spawn("pyramid","#6fcf80",0.0,0.7);
  spawn("diamond","#f277c6",-0.5,-0.6);
})();
</script>
</body>
</html>
