<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shake Ball</title>
<meta name="description" content="Grab, spin and shake a 3D magic 8-ball for live answers — scan to play on your phone." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" />
<style>
  :root{
    --bg:#0B1020; --bg2:#131a33; --ink:#EAF0FF; --muted:#93a0c8; --line:rgba(255,255,255,.14);
    --panel:rgba(18,24,48,.66); --accent:#8b7bff; --gold:#ffd166; --mint:#5ee6b4;
    --display:'Bricolage Grotesque', system-ui, sans-serif;
    --body:'IBM Plex Sans', system-ui, sans-serif;
    --mono:'Space Mono', ui-monospace, monospace;
    --shadow:0 26px 70px -30px rgba(0,0,0,.9);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#e9ecf7; --bg2:#f4f6fd; --ink:#171c2e; --muted:#5a6488; --line:rgba(20,24,50,.14);
      --panel:rgba(255,255,255,.74); --accent:#5b46e0; --gold:#c9911a; --mint:#159a6c;
      --shadow:0 26px 70px -34px rgba(40,44,90,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{
    font-family:var(--body); color:var(--ink); overflow:hidden;
    background:radial-gradient(120% 90% at 50% 12%, var(--bg2), var(--bg) 70%);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  [hidden]{display:none !important}

  #scene{position:fixed; inset:0; z-index:0; width:100%; height:100%; touch-action:none; cursor:grab}
  #scene:active{cursor:grabbing}

  .ui{position:fixed; inset:0; z-index:1; pointer-events:none; display:flex; flex-direction:column; align-items:center;
      padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px))}

  .brand{align-self:flex-start; display:flex; align-items:center; gap:10px}
  .beacon{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
  .brand b{font-family:var(--display); font-weight:800; font-size:1.15rem; letter-spacing:.01em}
  .brand span{display:block; font-family:var(--mono); font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-top:-2px}

  .spacer{flex:1}

  /* Answer plaque */
  .plaque{
    pointer-events:none; max-width:min(520px,92vw); text-align:center; margin-bottom:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 22px;
    backdrop-filter:blur(16px); box-shadow:var(--shadow); opacity:0; transform:translateY(12px) scale(.96);
    transition:opacity .35s ease, transform .35s cubic-bezier(.2,.9,.3,1.3);
  }
  .plaque.show{opacity:1; transform:none}
  .plaque .k{font-family:var(--mono); font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
  .plaque .a{font-family:var(--display); font-weight:700; font-size:clamp(1.1rem,3.4vw,1.5rem); line-height:1.3; text-wrap:balance}

  .prompt{pointer-events:none; font-family:var(--mono); font-size:.74rem; letter-spacing:.08em; color:var(--muted); margin-bottom:16px; text-align:center;
          background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px); padding:8px 14px; border-radius:20px}
  .prompt b{color:var(--ink)}

  .controls{pointer-events:auto; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:16px}
  .btn{border:none; border-radius:14px; padding:14px 22px; font-size:1rem; font-weight:600; display:inline-flex; align-items:center; gap:9px; transition:transform .12s, box-shadow .2s; color:#0a0620}
  .btn-primary{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%, #000)); color:#fff; box-shadow:0 14px 34px -14px var(--accent)}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-primary:disabled{opacity:.6; cursor:default; transform:none}

  /* QR */
  .qr{pointer-events:auto; display:flex; align-items:center; gap:14px; max-width:min(460px,94vw);
      background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 14px;
      backdrop-filter:blur(16px); box-shadow:var(--shadow)}
  .qr img{width:74px; height:74px; border-radius:9px; background:#fff; padding:5px; flex:none}
  .qr h3{font-family:var(--display); font-weight:700; margin:0 0 2px; font-size:.98rem}
  .qr p{margin:0; color:var(--muted); font-size:.76rem; line-height:1.35}
  .qr .url{font-family:var(--mono); font-size:.64rem; color:var(--mint); word-break:break-all; margin-top:4px; cursor:pointer}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D magic 8-ball. Drag to spin, tap to ask."></canvas>

<div class="ui">
  <div class="brand">
    <span class="beacon"></span>
    <div><b>SHAKE BALL</b><span>grab · spin · ask</span></div>
  </div>

  <div class="spacer"></div>

  <div class="plaque" id="plaque">
    <div class="k" id="plaqueK">the ball says</div>
    <div class="a" id="plaqueA"></div>
  </div>

  <div class="prompt" id="prompt"><b>Grab the ball</b> and fling it around · <b>tap it</b> to ask a question</div>

  <div class="controls">
    <button class="btn btn-primary" id="askBtn">🎱 Shake for an answer</button>
  </div>

  <div class="qr">
    <img id="qrImg" alt="QR code to open this on a phone" />
    <div>
      <h3>📱 Scan to play</h3>
      <p>Open the ball on your phone and shake it there.</p>
      <div class="url" id="qrUrl" title="Click to copy"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
"use strict";
(function(){
  var $=function(s){return document.querySelector(s);};
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function cssVar(n,f){ var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v||f; }

  /* ---------- QR: scan to play ---------- */
  (function(){
    var url=window.location.href, isWeb=/^https?:/i.test(url);
    $("#qrImg").src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=6&data="+encodeURIComponent(url);
    $("#qrUrl").textContent=isWeb?url:"host online to make this scannable";
    $("#qrUrl").addEventListener("click", function(){
      if(!isWeb) return;
      try{ navigator.clipboard.writeText(url); $("#qrUrl").textContent="copied ✓"; setTimeout(function(){ $("#qrUrl").textContent=url; },1300);}catch(e){}
    });
  })();

  /* ==================================================
     THREE.JS — a draggable 3D magic 8-ball
  ================================================== */
  if(typeof THREE==="undefined"){ $("#prompt").textContent="3D couldn’t load — check your connection."; return; }
  var canvas=$("#scene");
  var renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas, alpha:true, antialias:true}); }
  catch(e){ $("#prompt").textContent="Your browser can’t show 3D here."; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0,0,7);

  // lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var key=new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(4,6,6); scene.add(key);
  var rim=new THREE.PointLight(new THREE.Color(cssVar("--accent","#8b7bff")).getHex(), 1.2, 40); rim.position.set(-6,-2,4); scene.add(rim);
  var rim2=new THREE.PointLight(new THREE.Color(cssVar("--mint","#5ee6b4")).getHex(), 0.8, 40); rim2.position.set(6,-4,2); scene.add(rim2);

  // the ball group
  var ball=new THREE.Group(); scene.add(ball);
  var R=2.05;
  var sphere=new THREE.Mesh(
    new THREE.SphereGeometry(R,64,64),
    new THREE.MeshStandardMaterial({color:0x0a0a12, metalness:0.55, roughness:0.18})
  );
  ball.add(sphere);

  // the white "8" patch (canvas texture on a small disc, child of ball so it spins along)
  function patchTexture(){
    var c=document.createElement("canvas"); c.width=c.height=256;
    var g=c.getContext("2d");
    g.fillStyle="#ffffff"; g.beginPath(); g.arc(128,128,120,0,Math.PI*2); g.fill();
    g.fillStyle="#12163a"; g.font="bold 150px Bricolage Grotesque, sans-serif";
    g.textAlign="center"; g.textBaseline="middle"; g.fillText("8",128,138);
    var t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
  }
  var patch=new THREE.Mesh(
    new THREE.CircleGeometry(0.78,48),
    new THREE.MeshStandardMaterial({map:patchTexture(), metalness:0.1, roughness:0.5})
  );
  patch.position.set(0,0,R+0.002);
  ball.add(patch);

  // faint glow halo behind ball
  var halo=new THREE.Mesh(
    new THREE.SphereGeometry(R*1.5,32,32),
    new THREE.MeshBasicMaterial({color:new THREE.Color(cssVar("--accent","#8b7bff")).getHex(), transparent:true, opacity:0.06})
  );
  scene.add(halo);

  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  resize(); addEventListener("resize",resize);

  /* ---------- drag / spin physics ---------- */
  var dragging=false, lastX=0, lastY=0, downX=0, downY=0, downT=0, moved=0;
  var velX=0, velY=0;                 // angular velocity
  var shakeT=0;                       // remaining shake time

  function onDown(e){
    dragging=true; canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
    lastX=downX=e.clientX; lastY=downY=e.clientY; downT=Date.now(); moved=0; velX=velY=0;
  }
  function onMove(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    ball.rotation.y += dx*0.006;
    ball.rotation.x += dy*0.006;
    velY = dx*0.006; velX = dy*0.006;
  }
  function onUp(e){
    if(!dragging) return; dragging=false;
    var dt=Date.now()-downT;
    // a quick tap with little movement = "ask"
    if(moved<10 && dt<300){ ask(); }
  }
  canvas.addEventListener("pointerdown", onDown);
  addEventListener("pointermove", onMove);
  addEventListener("pointerup", onUp);
  addEventListener("pointercancel", function(){ dragging=false; });

  /* ---------- ask the ball (Advice Slip API) ---------- */
  var asking=false;
  function ask(){
    if(asking) return; asking=true;
    $("#askBtn").disabled=true;
    $("#plaque").classList.remove("show");
    $("#prompt").innerHTML="<b>shaking…</b>";
    shakeT=0.7; // seconds of shake
    // fetch during the shake so the answer lands as it settles
    fetch("https://api.adviceslip.com/advice?t="+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){ setTimeout(function(){ reveal(d.slip.advice); }, 720); })
      .catch(function(){ setTimeout(function(){ reveal("The ball is cloudy — ask again."); }, 720); });
  }
  function reveal(text){
    $("#plaqueA").textContent = "“"+text+"”";
    $("#plaque").classList.add("show");
    $("#prompt").innerHTML="<b>tap the ball</b> to ask again";
    $("#askBtn").disabled=false; asking=false;
    if(typeof confetti==="function" && !reduce){
      confetti({particleCount:60, spread:70, startVelocity:32, origin:{y:.5},
        colors:[cssVar("--accent","#8b7bff"),cssVar("--gold","#ffd166"),cssVar("--mint","#5ee6b4")]});
    }
  }
  $("#askBtn").addEventListener("click", ask);

  /* ---------- render loop ---------- */
  var t=0, clock=new THREE.Clock();
  function frame(){
    var dt=Math.min(clock.getDelta(),0.05); t+=dt;
    if(!dragging){
      if(shakeT>0){
        shakeT-=dt;
        var s=shakeT*1.4;
        ball.rotation.x += (Math.random()-0.5)*s;
        ball.rotation.y += (Math.random()-0.5)*s;
      } else {
        // inertia + gentle idle drift
        ball.rotation.y += velY; ball.rotation.x += velX;
        velY*=0.965; velX*=0.965;
        if(Math.abs(velY)<0.0005 && Math.abs(velX)<0.0005 && !reduce){ ball.rotation.y += 0.003; }
      }
    }
    // gentle bob
    ball.position.y = Math.sin(t*1.4)*0.08;
    halo.position.copy(ball.position);
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  frame();

  // theme-reactive lights
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      rim.color=new THREE.Color(cssVar("--accent","#8b7bff"));
      rim2.color=new THREE.Color(cssVar("--mint","#5ee6b4"));
      halo.material.color=new THREE.Color(cssVar("--accent","#8b7bff"));
    });
  }
})();
</script>
</body>
</html>
