<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ball Pit</title>
<meta name="description" content="A playful 3D ball pit — pick a color and drop balls into the tank. Scan the QR to play on your phone." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" />
<style>
  :root{
    --bg:#0b1020; --bg2:#141b36; --ink:#eef2ff; --muted:#9aa6d0; --line:rgba(255,255,255,.14);
    --panel:rgba(16,22,46,.72); --accent:#8b7bff; --mint:#5ee6b4; --gold:#ffd166;
    --display:'Bricolage Grotesque', system-ui, sans-serif;
    --body:'IBM Plex Sans', system-ui, sans-serif;
    --mono:'Space Mono', ui-monospace, monospace;
    --shadow:0 24px 64px -30px rgba(0,0,0,.85);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#e8ebf7; --bg2:#f5f7fe; --ink:#161a2c; --muted:#5b6488; --line:rgba(20,24,50,.14);
      --panel:rgba(255,255,255,.78); --accent:#5b46e0; --mint:#149a6c; --gold:#c9911a;
      --shadow:0 24px 64px -34px rgba(40,44,90,.45);
      color-scheme:light;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{
    font-family:var(--body); color:var(--ink); overflow:hidden;
    background:radial-gradient(130% 100% at 50% 6%, var(--bg2), var(--bg) 68%);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  [hidden]{display:none!important}
  button{font-family:inherit; cursor:pointer}
  #tank{position:fixed; inset:0; z-index:0; width:100%; height:100%; touch-action:none; cursor:grab}
  #tank:active{cursor:grabbing}

  .ui{position:fixed; inset:0; z-index:1; pointer-events:none; display:flex; flex-direction:column;
      padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}

  .topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px}
  .brand b{font-family:var(--display); font-weight:800; font-size:1.2rem; letter-spacing:.01em}
  .brand span{display:block; font-family:var(--mono); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-top:-3px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .live{pointer-events:auto; margin-left:auto; display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line);
        border-radius:20px; padding:7px 13px; backdrop-filter:blur(14px); box-shadow:var(--shadow)}
  .live b{font-variant-numeric:tabular-nums}
  .clear{pointer-events:auto; border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:20px;
         padding:8px 13px; font-family:var(--mono); font-size:.72rem; backdrop-filter:blur(14px)}
  .clear:hover{color:var(--ink); border-color:var(--accent)}

  .spacer{flex:1}

  .dock{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .controls{pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:20px;
            padding:16px; backdrop-filter:blur(16px); box-shadow:var(--shadow); flex:1 1 320px; max-width:520px}
  .clabel{font-family:var(--mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .swatches{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:14px}
  .sw{width:34px;height:34px;border-radius:11px; border:2px solid transparent; cursor:pointer; transition:transform .12s; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .sw:hover{transform:scale(1.08)}
  .sw.on{border-color:var(--ink); transform:scale(1.12)}
  .drop{width:100%; border:none; border-radius:15px; padding:17px; font-family:var(--display); font-weight:800; font-size:1.25rem;
        color:#0a0620; display:flex; align-items:center; justify-content:center; gap:10px; transition:transform .1s, box-shadow .2s}
  .drop:active{transform:scale(.97)}
  .drop small{font-family:var(--mono); font-weight:400; font-size:.7rem; color:rgba(10,6,32,.6)}

  .join{pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:14px;
        backdrop-filter:blur(16px); box-shadow:var(--shadow); display:flex; gap:14px; align-items:center; flex:0 0 auto}
  .join #qr{width:104px;height:104px;background:#fff;border-radius:12px;padding:7px; display:grid; place-items:center}
  .join #qr img,.join #qr canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
  .join .jt{max-width:210px}
  .join h3{font-family:var(--display); font-weight:700; margin:0 0 4px; font-size:1.05rem}
  .join p{margin:0; color:var(--muted); font-size:.8rem; line-height:1.4}
  .join .u{font-family:var(--mono); font-size:.62rem; color:var(--mint); word-break:break-all; margin-top:6px; cursor:pointer}
  .note{pointer-events:none; text-align:center; font-family:var(--mono); font-size:.62rem; color:var(--muted); margin-top:10px; width:100%}

  @media (max-width:640px){
    .join{order:-1; width:100%}
    .join #qr{width:84px;height:84px}
    .controls{max-width:none}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important} }
</style>
</head>
<body>
<canvas id="tank" aria-label="A 3D ball pit. Drag to look around, tap to drop a ball."></canvas>

<div class="ui">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><div><b>BALL PIT</b><span>pick · drop · pile up</span></div></div>
    <div class="live"><b id="count">0</b>&nbsp;balls</div>
    <button class="clear" id="clearBtn">✕ clear</button>
  </div>

  <div class="spacer"></div>

  <div class="dock">
    <div class="controls">
      <div class="clabel">1 · your color</div>
      <div class="swatches" id="swatches"></div>
      <div class="clabel">2 · drop it in</div>
      <button class="drop" id="dropBtn">🫳 DROP A BALL <small>(or tap the tank)</small></button>
    </div>

    <div class="join">
      <div id="qr"></div>
      <div class="jt">
        <h3>📱 Scan to play</h3>
        <p>Point a phone camera at the code to open the pit on your phone.</p>
        <div class="u" id="shareUrl" title="Copy link"></div>
      </div>
    </div>
  </div>
  <div class="note">Drag to look around · tap the tank or the button to drop a ball.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
(function(){
  var $=function(s){return document.querySelector(s);};
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  var isSmall = Math.min(innerWidth,innerHeight) < 640;

  /* ---------- colors ---------- */
  var COLORS=["#ff5d5d","#ff9f43","#ffd93d","#7be06b","#4ecdc4","#5aa9ff","#8b7bff","#ff6fd8","#ffffff","#2b2b3a"];
  var myColor = COLORS[Math.floor(Math.random()*8)];

  (function buildSwatches(){
    var box=$("#swatches");
    COLORS.forEach(function(c){
      var b=document.createElement("button");
      b.className="sw"+(c===myColor?" on":""); b.style.background=c; b.setAttribute("aria-label","color "+c);
      b.addEventListener("click", function(){
        myColor=c;
        box.querySelectorAll(".sw").forEach(function(s){ s.classList.remove("on"); });
        b.classList.add("on"); $("#dropBtn").style.background=c;
      });
      box.appendChild(b);
    });
    $("#dropBtn").style.background=myColor;
  })();

  /* ---------- QR of this page's own URL ---------- */
  var SHARE_URL = window.location.href.split("#")[0];
  var isWeb = /^https?:/i.test(SHARE_URL);
  try{
    new QRCode($("#qr"), {text:SHARE_URL, width:180, height:180, colorDark:"#0b1020", colorLight:"#ffffff",
      correctLevel:(window.QRCode&&QRCode.CorrectLevel)?QRCode.CorrectLevel.M:undefined});
  }catch(e){ $("#qr").textContent="QR"; }
  $("#shareUrl").textContent = isWeb ? SHARE_URL : "host this page online to make the QR scannable";
  $("#shareUrl").addEventListener("click", function(){
    if(!isWeb) return;
    try{ navigator.clipboard.writeText(SHARE_URL); var o=$("#shareUrl").textContent; $("#shareUrl").textContent="copied ✓"; setTimeout(function(){ $("#shareUrl").textContent=o; },1200);}catch(e){}
  });

  /* ==========================================================
     3D tank: three.js render + cannon.js physics
  ========================================================== */
  var canvas=$("#tank");
  if(typeof THREE==="undefined" || typeof CANNON==="undefined"){ $("#count").textContent="3D failed to load"; return; }
  var renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas, alpha:true, antialias:true}); }
  catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  var key=new THREE.DirectionalLight(0xffffff,0.9); key.position.set(6,12,8); scene.add(key);
  var p1=new THREE.PointLight(0x8b7bff,0.8,60); p1.position.set(-8,6,6); scene.add(p1);
  var p2=new THREE.PointLight(0x5ee6b4,0.6,60); p2.position.set(8,4,-2); scene.add(p2);

  var HALF_W=3, HALF_D=2, HEIGHT=8, R=0.34, SPAWN_Y=7;
  var MAX = isSmall ? 55 : 150;

  var floorMesh=new THREE.Mesh(
    new THREE.BoxGeometry(2*HALF_W+0.3,0.5,2*HALF_D+0.3),
    new THREE.MeshStandardMaterial({color:0x1a2140, metalness:0.3, roughness:0.6}));
  floorMesh.position.y=-0.25; scene.add(floorMesh);
  var glass=new THREE.Mesh(
    new THREE.BoxGeometry(2*HALF_W,HEIGHT,2*HALF_D),
    new THREE.MeshStandardMaterial({color:0x9fb4ff, metalness:0.1, roughness:0.05, transparent:true, opacity:0.06, side:THREE.DoubleSide}));
  glass.position.y=HEIGHT/2; scene.add(glass);
  var edges=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(2*HALF_W,HEIGHT,2*HALF_D)),
    new THREE.LineBasicMaterial({color:0x8b7bff, transparent:true, opacity:0.5}));
  edges.position.y=HEIGHT/2; scene.add(edges);

  var world=new CANNON.World();
  world.gravity.set(0,-20,0);
  world.broadphase=new CANNON.NaiveBroadphase();
  world.solver.iterations=8;
  var ballMat=new CANNON.Material("ball"), wallMat=new CANNON.Material("wall");
  world.addContactMaterial(new CANNON.ContactMaterial(ballMat,wallMat,{friction:0.15,restitution:0.35}));
  world.addContactMaterial(new CANNON.ContactMaterial(ballMat,ballMat,{friction:0.25,restitution:0.2}));

  function addPlane(px,py,pz, ax,ay,az, angle){
    var b=new CANNON.Body({mass:0, material:wallMat});
    b.addShape(new CANNON.Plane());
    b.quaternion.setFromAxisAngle(new CANNON.Vec3(ax,ay,az), angle);
    b.position.set(px,py,pz); world.addBody(b);
  }
  addPlane(0,0,0, 1,0,0, -Math.PI/2);       // floor
  addPlane(-HALF_W,0,0, 0,1,0, Math.PI/2);   // left
  addPlane(HALF_W,0,0, 0,1,0, -Math.PI/2);   // right
  addPlane(0,0,-HALF_D, 0,1,0, 0);           // back
  addPlane(0,0,HALF_D, 0,1,0, Math.PI);      // front

  var sphereGeo=new THREE.SphereGeometry(R,20,16);
  var sphereShape=new CANNON.Sphere(R);
  var balls=[];

  function updateCount(){ $("#count").textContent=balls.length; }

  function spawnBall(color,x,z){
    var mat=new THREE.MeshStandardMaterial({color:color, metalness:0.2, roughness:0.28,
      emissive:new THREE.Color(color).multiplyScalar(0.12)});
    var mesh=new THREE.Mesh(sphereGeo,mat); scene.add(mesh);
    var body=new CANNON.Body({mass:1, material:ballMat});
    body.addShape(sphereShape);
    body.position.set(x, SPAWN_Y, z);
    body.velocity.set((Math.random()-0.5)*1.5, -3, (Math.random()-0.5)*1.5);
    body.linearDamping=0.05; body.angularDamping=0.15;
    world.addBody(body);
    balls.push({mesh:mesh, body:body, mat:mat});
    if(balls.length>MAX){ var old=balls.shift(); world.removeBody(old.body); scene.remove(old.mesh); old.mat.dispose(); }
    updateCount();
    var d=$("#dropBtn"); d.style.transform="scale(.96)"; setTimeout(function(){ d.style.transform=""; },90);
  }
  function rand(range){ return (Math.random()-0.5)*2*range; }
  function doDrop(){ spawnBall(myColor, rand(HALF_W-R-0.15), rand(HALF_D-R-0.15)); }

  $("#dropBtn").addEventListener("click", doDrop);
  $("#clearBtn").addEventListener("click", function(){
    balls.forEach(function(b){ world.removeBody(b.body); scene.remove(b.mesh); b.mat.dispose(); });
    balls=[]; updateCount();
  });

  /* ---------- camera orbit (drag) + tap to drop ---------- */
  var target=new THREE.Vector3(0,2.6,0), Rcam=15;
  var theta=0.55, phi=1.12, tTheta=theta, tPhi=phi;
  var dragging=false, lx=0, ly=0, downT=0, moved=0;
  canvas.addEventListener("pointerdown", function(e){
    dragging=true; lx=e.clientX; ly=e.clientY; downT=Date.now(); moved=0;
    canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
  });
  addEventListener("pointermove", function(e){
    if(!dragging) return;
    var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    tTheta-=dx*0.006; tPhi=Math.max(0.35,Math.min(1.45, tPhi-dy*0.006));
  });
  addEventListener("pointerup", function(){
    if(!dragging) return; dragging=false;
    if(moved<10 && (Date.now()-downT)<300){ doDrop(); }
  });
  addEventListener("pointercancel", function(){ dragging=false; });

  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  resize(); addEventListener("resize",resize);

  var clock=new THREE.Clock();
  (function frame(){
    var dt=Math.min(clock.getDelta(),0.033);
    world.step(1/60, dt, 3);
    for(var i=0;i<balls.length;i++){ balls[i].mesh.position.copy(balls[i].body.position); balls[i].mesh.quaternion.copy(balls[i].body.quaternion); }
    if(!dragging && !reduce){ tTheta+=0.0012; }
    theta+=(tTheta-theta)*0.12; phi+=(tPhi-phi)*0.12;
    camera.position.set(
      target.x + Rcam*Math.sin(phi)*Math.sin(theta),
      target.y + Rcam*Math.cos(phi),
      target.z + Rcam*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  })();

  // start with a few balls so the pit isn't empty
  spawnBall("#5aa9ff",-1.2,0.4); spawnBall("#ff9f43",0.8,-0.5); spawnBall("#7be06b",0.1,0.9);
})();
</script>
</body>
</html>
